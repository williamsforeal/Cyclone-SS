<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad Intelligence Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #e0e0e0; }

    /* Header */
    .header { background: #1a1a1a; border-bottom: 1px solid #333; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
    .header h1 { font-size: 18px; font-weight: 600; color: #fff; }
    .tab-nav { display: flex; gap: 4px; margin-left: 24px; }
    .tab-btn { padding: 8px 16px; border: none; background: transparent; color: #888; cursor: pointer; border-radius: 6px; font-size: 14px; font-weight: 500; transition: all 0.2s; }
    .tab-btn:hover { background: #2a2a2a; color: #ccc; }
    .tab-btn.active { background: #333; color: #fff; }

    /* Main layout */
    .main { padding: 20px 24px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Controls bar */
    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
    .controls input, .controls select { padding: 8px 12px; border: 1px solid #333; border-radius: 6px; background: #1a1a1a; color: #e0e0e0; font-size: 14px; }
    .controls input { min-width: 250px; }
    .controls select { min-width: 120px; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #333; color: #e0e0e0; }
    .btn-secondary:hover { background: #444; }
    .btn-small { padding: 4px 10px; font-size: 12px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Product / Ad Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; overflow: hidden; transition: border-color 0.2s; }
    .card:hover { border-color: #444; }
    .card-img { width: 100%; height: 200px; object-fit: cover; background: #222; }
    .card-body { padding: 14px; }
    .card-title { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { font-size: 12px; color: #888; margin-bottom: 4px; }
    .card-price { font-size: 16px; font-weight: 700; color: #10b981; }
    .card-price .original { text-decoration: line-through; color: #666; font-size: 12px; font-weight: 400; margin-left: 6px; }
    .card-stats { display: flex; gap: 12px; margin-top: 8px; font-size: 12px; color: #888; }
    .card-actions { display: flex; gap: 8px; margin-top: 10px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .badge-green { background: #064e3b; color: #10b981; }
    .badge-blue { background: #1e3a5f; color: #60a5fa; }
    .badge-yellow { background: #713f12; color: #fbbf24; }
    .badge-red { background: #7f1d1d; color: #f87171; }
    .badge-gray { background: #333; color: #999; }
    .bookmark-btn { background: none; border: none; cursor: pointer; font-size: 18px; color: #666; transition: color 0.2s; }
    .bookmark-btn.active { color: #fbbf24; }
    .bookmark-btn:hover { color: #fbbf24; }

    /* Status indicators */
    .status-bar { padding: 10px 16px; background: #1e293b; border-radius: 6px; margin-bottom: 16px; font-size: 13px; color: #94a3b8; display: none; }
    .status-bar.visible { display: block; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #555; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modal */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
    .modal-overlay.visible { display: flex; }
    .modal { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 24px; }
    .modal h2 { font-size: 18px; margin-bottom: 16px; color: #fff; }
    .modal-close { float: right; background: none; border: none; color: #888; font-size: 24px; cursor: pointer; }
    .modal-close:hover { color: #fff; }
    .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; font-size: 13px; }
    .detail-label { color: #888; }
    .detail-value { color: #e0e0e0; text-align: right; max-width: 60%; }

    /* Empty state */
    .empty { text-align: center; padding: 60px 20px; color: #666; }
    .empty h3 { font-size: 18px; margin-bottom: 8px; color: #888; }

    /* Saved searches sidebar */
    .saved-searches { margin-top: 20px; }
    .saved-search-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px; margin-bottom: 6px; }
    .saved-search-item .keyword { font-size: 13px; color: #e0e0e0; }
    .saved-search-item .last-run { font-size: 11px; color: #666; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Ad Intelligence Hub</h1>
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="tiktok">TikTok Products</button>
      <button class="tab-btn" data-tab="meta">Meta Ads</button>
    </div>
  </div>

  <div class="main">
    <!-- ========== TIKTOK TAB ========== -->
    <div id="tab-tiktok" class="tab-content active">
      <div class="controls">
        <input type="text" id="tt-keyword" placeholder="Search TikTok Shop (e.g. posture corrector)..." />
        <select id="tt-region">
          <option value="US">US</option>
          <option value="GB">UK</option>
          <option value="DE">Germany</option>
          <option value="ID">Indonesia</option>
        </select>
        <button class="btn btn-primary" id="tt-search-btn">Search</button>
        <button class="btn btn-secondary" id="tt-save-search-btn">Save Search</button>
        <select id="tt-sort">
          <option value="sold">Best Sellers</option>
          <option value="newest">Newest</option>
          <option value="price_low">Price: Low to High</option>
          <option value="price_high">Price: High to Low</option>
          <option value="rating">Top Rated</option>
        </select>
        <label style="font-size:13px; display:flex; align-items:center; gap:4px;">
          <input type="checkbox" id="tt-bookmarked-only" /> Bookmarked
        </label>
      </div>

      <div id="tt-status" class="status-bar"></div>

      <!-- Saved Searches -->
      <div id="tt-saved-searches" class="saved-searches" style="display:none;">
        <h4 style="font-size:14px; color:#888; margin-bottom:8px;">Saved Searches</h4>
        <div id="tt-saved-list"></div>
      </div>

      <div id="tt-grid" class="grid"></div>
      <div id="tt-empty" class="empty" style="display:none;">
        <h3>No TikTok products yet</h3>
        <p>Search for a keyword to discover trending TikTok Shop products</p>
      </div>
    </div>

    <!-- ========== META ADS TAB ========== -->
    <div id="tab-meta" class="tab-content">
      <div class="controls">
        <select id="meta-brand" multiple style="min-width:200px; height:36px;">
          <option value="">All Brands</option>
        </select>
        <select id="meta-sort">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="rank">Top Ranked</option>
        </select>
        <select id="meta-media">
          <option value="">All Media</option>
          <option value="video">Video</option>
          <option value="image">Image</option>
        </select>
        <button class="btn btn-primary" id="meta-scrape-btn">Scrape Selected</button>
        <label style="font-size:13px; display:flex; align-items:center; gap:4px;">
          <input type="checkbox" id="meta-bookmarked-only" /> Bookmarked
        </label>
      </div>

      <div id="meta-status" class="status-bar"></div>
      <div id="meta-grid" class="grid"></div>
      <div id="meta-empty" class="empty" style="display:none;">
        <h3>No Meta ads yet</h3>
        <p>Add brands and scrape their ads to get started</p>
      </div>
    </div>
  </div>

  <!-- Product Detail Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-content">
      <button class="modal-close" id="modal-close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    // ========== TAB SWITCHING ==========
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'meta') loadMetaAds();
        if (btn.dataset.tab === 'tiktok') loadTikTokProducts();
      });
    });

    // ========== MODAL ==========
    document.getElementById('modal-close').onclick = () => document.getElementById('modal-overlay').classList.remove('visible');
    document.getElementById('modal-overlay').onclick = (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('visible'); };

    function showModal(html) {
      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('modal-overlay').classList.add('visible');
    }

    // ========== TIKTOK PRODUCTS ==========
    const ttKeyword = document.getElementById('tt-keyword');
    const ttRegion = document.getElementById('tt-region');
    const ttSort = document.getElementById('tt-sort');
    const ttBookmarked = document.getElementById('tt-bookmarked-only');
    const ttStatus = document.getElementById('tt-status');
    const ttGrid = document.getElementById('tt-grid');
    const ttEmpty = document.getElementById('tt-empty');

    async function loadTikTokProducts() {
      const params = new URLSearchParams({ sort: ttSort.value, limit: '100' });
      if (ttKeyword.value) params.set('keyword', ttKeyword.value);
      if (ttBookmarked.checked) params.set('bookmarked_only', 'true');

      try {
        const res = await fetch('/api/tiktok/products?' + params);
        const products = await res.json();
        renderTikTokGrid(products);
      } catch (err) { console.error('Load products error:', err); }

      loadSavedSearches();
    }

    function renderTikTokGrid(products) {
      if (products.length === 0) {
        ttGrid.innerHTML = '';
        ttEmpty.style.display = 'block';
        return;
      }
      ttEmpty.style.display = 'none';

      ttGrid.innerHTML = products.map(p => {
        const imgSrc = p.stored_image_url || p.image_url || 'https://via.placeholder.com/400x400/222/666?text=No+Image';
        const discount = p.original_price > p.price ? Math.round((1 - p.price / p.original_price) * 100) : 0;
        const validationBadge = p.meta_validation_status === 'validated'
          ? '<span class="badge badge-green">Meta Validated</span>'
          : p.meta_validation_status === 'no_match'
          ? '<span class="badge badge-gray">No Meta Match</span>'
          : '';

        return `<div class="card">
          <img class="card-img" src="${imgSrc}" alt="${p.title}" onerror="this.src='https://via.placeholder.com/400x400/222/666?text=No+Image'" />
          <div class="card-body">
            <div class="card-title">${p.title || 'Untitled'}</div>
            <div class="card-price">$${(p.price || 0).toFixed(2)}${p.original_price > p.price ? `<span class="original">$${p.original_price.toFixed(2)}</span>` : ''}${discount > 0 ? ` <span class="badge badge-red">-${discount}%</span>` : ''}</div>
            <div class="card-stats">
              <span>${p.sold_count || '0 sold'}</span>
              <span>${p.rating ? p.rating + ' stars' : ''}</span>
              <span>${p.seller_name || ''}</span>
            </div>
            <div style="margin-top:6px">${validationBadge}</div>
            <div class="card-actions">
              <button class="bookmark-btn ${p.bookmarked ? 'active' : ''}" onclick="toggleTTBookmark(${p.id}, this)" title="Bookmark">${p.bookmarked ? '\u2605' : '\u2606'}</button>
              <button class="btn btn-secondary btn-small" onclick="validateOnMeta(${p.id})">Validate on Meta</button>
              <button class="btn btn-secondary btn-small" onclick="showTTDetail(${p.id})">Details</button>
              ${p.product_url ? `<a href="${p.product_url}" target="_blank" class="btn btn-secondary btn-small">TikTok</a>` : ''}
            </div>
          </div>
        </div>`;
      }).join('');
    }

    async function searchTikTok() {
      const keyword = ttKeyword.value.trim();
      if (!keyword) return;

      ttStatus.innerHTML = '<span class="spinner"></span>Searching TikTok Shop for "' + keyword + '"...';
      ttStatus.classList.add('visible');
      document.getElementById('tt-search-btn').disabled = true;

      try {
        const res = await fetch('/api/tiktok/scrape', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ keyword, region: ttRegion.value })
        });
        const data = await res.json();

        if (data.mock || data.resultCount !== undefined) {
          // Mock mode or instant result
          ttStatus.innerHTML = 'Found ' + (data.resultCount || 0) + ' products';
          setTimeout(() => ttStatus.classList.remove('visible'), 3000);
          loadTikTokProducts();
        } else if (data.jobId) {
          // Poll for results
          pollTikTokJob(data.jobId);
        } else if (data.error) {
          ttStatus.innerHTML = 'Error: ' + data.error;
          setTimeout(() => ttStatus.classList.remove('visible'), 5000);
        }
      } catch (err) {
        ttStatus.innerHTML = 'Search failed: ' + err.message;
      }
      document.getElementById('tt-search-btn').disabled = false;
    }

    async function pollTikTokJob(jobId) {
      const poll = async () => {
        try {
          const res = await fetch('/api/tiktok/scrape/status/' + jobId);
          const data = await res.json();
          if (data.status === 'complete') {
            ttStatus.innerHTML = 'Found ' + (data.resultCount || 0) + ' products';
            setTimeout(() => ttStatus.classList.remove('visible'), 3000);
            loadTikTokProducts();
          } else if (data.status === 'error') {
            ttStatus.innerHTML = 'Scrape failed: ' + (data.error || 'Unknown error');
          } else {
            ttStatus.innerHTML = '<span class="spinner"></span>Scraping TikTok Shop...';
            setTimeout(poll, 3000);
          }
        } catch (err) { ttStatus.innerHTML = 'Poll error: ' + err.message; }
      };
      poll();
    }

    async function toggleTTBookmark(id, el) {
      try {
        const res = await fetch('/api/tiktok/products/' + id + '/bookmark', { method: 'POST' });
        const data = await res.json();
        el.classList.toggle('active', data.bookmarked);
        el.textContent = data.bookmarked ? '\u2605' : '\u2606';
      } catch (err) { console.error(err); }
    }

    async function validateOnMeta(id) {
      try {
        const res = await fetch('/api/tiktok/products/' + id + '/validate', { method: 'POST' });
        const data = await res.json();
        if (data.validated) {
          alert('Match found: ' + data.brand_name + ' (' + data.ad_count + ' ads in vault)');
        } else {
          alert('No matching Meta brand found for this product');
        }
        loadTikTokProducts();
      } catch (err) { console.error(err); }
    }

    async function showTTDetail(id) {
      try {
        const res = await fetch('/api/tiktok/products/' + id);
        const p = await res.json();
        const html = `
          <h2>${p.title || 'Product Details'}</h2>
          ${p.stored_image_url || p.image_url ? `<img src="${p.stored_image_url || p.image_url}" style="width:100%; max-height:300px; object-fit:contain; border-radius:8px; margin-bottom:16px; background:#222;" />` : ''}
          <div class="detail-row"><span class="detail-label">Price</span><span class="detail-value">$${(p.price||0).toFixed(2)}${p.original_price > p.price ? ' (was $' + p.original_price.toFixed(2) + ')' : ''}</span></div>
          <div class="detail-row"><span class="detail-label">Sold</span><span class="detail-value">${p.sold_count || 'N/A'}</span></div>
          <div class="detail-row"><span class="detail-label">Rating</span><span class="detail-value">${p.rating || 'N/A'} (${p.review_count || 0} reviews)</span></div>
          <div class="detail-row"><span class="detail-label">Seller</span><span class="detail-value">${p.seller_name || 'N/A'}</span></div>
          <div class="detail-row"><span class="detail-label">Category</span><span class="detail-value">${p.category || 'N/A'}</span></div>
          <div class="detail-row"><span class="detail-label">Region</span><span class="detail-value">${p.region || 'US'}</span></div>
          <div class="detail-row"><span class="detail-label">Search Keyword</span><span class="detail-value">${p.search_keyword || 'N/A'}</span></div>
          <div class="detail-row"><span class="detail-label">First Seen</span><span class="detail-value">${p.first_seen || 'N/A'}</span></div>
          <div class="detail-row"><span class="detail-label">Meta Validation</span><span class="detail-value">${p.meta_validation_status || 'pending'}</span></div>
          ${p.description ? `<div style="margin-top:12px; font-size:13px; color:#888;">${p.description}</div>` : ''}
          <div style="margin-top:16px;">
            <label style="font-size:13px; color:#888;">Notes</label>
            <textarea id="tt-notes-${p.id}" style="width:100%; padding:8px; background:#222; border:1px solid #333; color:#e0e0e0; border-radius:6px; margin-top:4px; min-height:60px;">${p.notes || ''}</textarea>
            <button class="btn btn-primary btn-small" style="margin-top:6px;" onclick="saveTTNotes(${p.id})">Save Notes</button>
          </div>
          <div style="margin-top:12px; display:flex; gap:8px;">
            ${p.product_url ? `<a href="${p.product_url}" target="_blank" class="btn btn-primary btn-small">View on TikTok Shop</a>` : ''}
            <button class="btn btn-secondary btn-small" onclick="validateOnMeta(${p.id})">Validate on Meta</button>
          </div>
        `;
        showModal(html);
      } catch (err) { console.error(err); }
    }

    async function saveTTNotes(id) {
      const notes = document.getElementById('tt-notes-' + id).value;
      await fetch('/api/tiktok/products/' + id + '/notes', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ notes })
      });
    }

    // Saved Searches
    async function loadSavedSearches() {
      try {
        const res = await fetch('/api/tiktok/searches');
        const searches = await res.json();
        const container = document.getElementById('tt-saved-searches');
        const list = document.getElementById('tt-saved-list');
        if (searches.length === 0) { container.style.display = 'none'; return; }
        container.style.display = 'block';
        list.innerHTML = searches.map(s => `
          <div class="saved-search-item">
            <div>
              <span class="keyword">${s.name || s.keyword}</span>
              <span class="last-run">${s.last_run ? ' - ran ' + new Date(s.last_run).toLocaleDateString() : ''}</span>
            </div>
            <div style="display:flex;gap:4px;">
              <button class="btn btn-primary btn-small" onclick="runSavedSearch(${s.id})">Run</button>
              <button class="btn btn-secondary btn-small" onclick="deleteSavedSearch(${s.id})">&times;</button>
            </div>
          </div>
        `).join('');
      } catch (err) { console.error(err); }
    }

    async function saveSearch() {
      const keyword = ttKeyword.value.trim();
      if (!keyword) return;
      await fetch('/api/tiktok/searches', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ keyword, region: ttRegion.value })
      });
      loadSavedSearches();
    }

    async function runSavedSearch(id) {
      ttStatus.innerHTML = '<span class="spinner"></span>Running saved search...';
      ttStatus.classList.add('visible');
      try {
        const res = await fetch('/api/tiktok/searches/' + id + '/run', { method: 'POST' });
        const data = await res.json();
        if (data.mock || data.resultCount !== undefined) {
          ttStatus.innerHTML = 'Found ' + (data.resultCount || 0) + ' products';
          setTimeout(() => ttStatus.classList.remove('visible'), 3000);
          loadTikTokProducts();
        } else if (data.jobId) {
          pollTikTokJob(data.jobId);
        }
      } catch (err) { ttStatus.innerHTML = 'Error: ' + err.message; }
    }

    async function deleteSavedSearch(id) {
      await fetch('/api/tiktok/searches/' + id, { method: 'DELETE' });
      loadSavedSearches();
    }

    // Event listeners
    document.getElementById('tt-search-btn').addEventListener('click', searchTikTok);
    ttKeyword.addEventListener('keypress', (e) => { if (e.key === 'Enter') searchTikTok(); });
    document.getElementById('tt-save-search-btn').addEventListener('click', saveSearch);
    ttSort.addEventListener('change', loadTikTokProducts);
    ttBookmarked.addEventListener('change', loadTikTokProducts);

    // ========== META ADS ==========
    const metaBrand = document.getElementById('meta-brand');
    const metaSort = document.getElementById('meta-sort');
    const metaMedia = document.getElementById('meta-media');
    const metaGrid = document.getElementById('meta-grid');
    const metaEmpty = document.getElementById('meta-empty');
    const metaStatus = document.getElementById('meta-status');

    async function loadBrands() {
      try {
        const res = await fetch('/api/brands');
        const brands = await res.json();
        metaBrand.innerHTML = '<option value="">All Brands</option>' +
          brands.map(b => `<option value="${b.id}">${b.brand_name} (${b.ad_count || 0})</option>`).join('');
      } catch (err) { console.error(err); }
    }

    async function loadMetaAds() {
      const params = new URLSearchParams({ sort: metaSort.value, limit: '100' });
      const selected = Array.from(metaBrand.selectedOptions).map(o => o.value).filter(v => v);
      selected.forEach(id => params.append('brand_ids', id));
      if (metaMedia.value) params.set('media_type', metaMedia.value);
      if (document.getElementById('meta-bookmarked-only').checked) {
        // Load bookmarked ads
        try {
          const res = await fetch('/api/ads/bookmarked');
          const ads = await res.json();
          renderMetaGrid(ads);
          return;
        } catch (err) { console.error(err); }
      }

      try {
        const res = await fetch('/api/ads?' + params);
        const ads = await res.json();
        renderMetaGrid(ads);
      } catch (err) { console.error(err); }
    }

    function renderMetaGrid(ads) {
      if (ads.length === 0) {
        metaGrid.innerHTML = '';
        metaEmpty.style.display = 'block';
        return;
      }
      metaEmpty.style.display = 'none';

      metaGrid.innerHTML = ads.map(ad => {
        const imgSrc = ad.stored_creative_url || ad.creative_url || 'https://via.placeholder.com/400x400/222/666?text=No+Image';
        const tags = [ad.ai_asset_type, ad.ai_messaging_angle].filter(Boolean);

        return `<div class="card">
          <img class="card-img" src="${imgSrc}" alt="${ad.headline}" onerror="this.src='https://via.placeholder.com/400x400/222/666?text=No+Image'" />
          <div class="card-body">
            <div class="card-meta">${ad.brand_name || ''} ${ad.creative_type === 'video' ? '<span class="badge badge-blue">Video</span>' : ''}</div>
            <div class="card-title">${ad.headline || ad.ad_copy?.substring(0, 80) || 'Untitled'}</div>
            <div class="card-stats">
              <span>Rank #${ad.rank || '?'}</span>
              <span>${ad.weeks_in_top10 || 1}w in top 10</span>
              ${ad.start_date ? `<span>${ad.start_date}</span>` : ''}
            </div>
            ${tags.length > 0 ? `<div style="margin-top:6px;">${tags.map(t => `<span class="badge badge-yellow">${t}</span>`).join(' ')}</div>` : ''}
            <div class="card-actions">
              <button class="bookmark-btn ${ad.bookmarked ? 'active' : ''}" onclick="toggleMetaBookmark(${ad.id}, this)">${ad.bookmarked ? '\u2605' : '\u2606'}</button>
              <button class="btn btn-secondary btn-small" onclick="showMetaDetail(${ad.id})">Details</button>
              ${ad.ad_library_link ? `<a href="${ad.ad_library_link}" target="_blank" class="btn btn-secondary btn-small">Ad Library</a>` : ''}
              ${!ad.ai_asset_type ? `<button class="btn btn-secondary btn-small" onclick="analyzeAd(${ad.id}, this)">Analyze</button>` : ''}
            </div>
          </div>
        </div>`;
      }).join('');
    }

    async function toggleMetaBookmark(id, el) {
      try {
        const res = await fetch('/api/ads/' + id + '/bookmark', { method: 'POST' });
        const data = await res.json();
        el.classList.toggle('active', data.bookmarked);
        el.textContent = data.bookmarked ? '\u2605' : '\u2606';
      } catch (err) { console.error(err); }
    }

    async function analyzeAd(id, btn) {
      btn.disabled = true; btn.textContent = '...';
      try {
        await fetch('/api/ads/' + id + '/analyze', { method: 'POST' });
        loadMetaAds();
      } catch (err) { console.error(err); }
      btn.disabled = false;
    }

    async function showMetaDetail(id) {
      try {
        const res = await fetch('/api/ads/' + id);
        const ad = await res.json();
        const html = `
          <h2>${ad.headline || 'Ad Details'}</h2>
          ${ad.stored_creative_url || ad.creative_url ? `<img src="${ad.stored_creative_url || ad.creative_url}" style="width:100%; max-height:300px; object-fit:contain; border-radius:8px; margin-bottom:16px; background:#222;" />` : ''}
          <div class="detail-row"><span class="detail-label">Brand</span><span class="detail-value">${ad.brand_name || 'N/A'}</span></div>
          <div class="detail-row"><span class="detail-label">Rank</span><span class="detail-value">#${ad.rank || '?'}</span></div>
          <div class="detail-row"><span class="detail-label">Weeks in Top 10</span><span class="detail-value">${ad.weeks_in_top10 || 1}</span></div>
          <div class="detail-row"><span class="detail-label">Media Type</span><span class="detail-value">${ad.creative_type || 'N/A'}</span></div>
          <div class="detail-row"><span class="detail-label">CTA</span><span class="detail-value">${ad.cta_type || 'N/A'}</span></div>
          <div class="detail-row"><span class="detail-label">Start Date</span><span class="detail-value">${ad.start_date || 'N/A'}</span></div>
          <div class="detail-row"><span class="detail-label">First Seen</span><span class="detail-value">${ad.first_seen || 'N/A'}</span></div>
          ${ad.ai_asset_type ? `
          <h3 style="margin-top:16px; font-size:14px; color:#888;">AI Analysis</h3>
          <div class="detail-row"><span class="detail-label">Asset Type</span><span class="detail-value"><span class="badge badge-yellow">${ad.ai_asset_type}</span></span></div>
          <div class="detail-row"><span class="detail-label">Visual Format</span><span class="detail-value"><span class="badge badge-yellow">${ad.ai_visual_format || 'N/A'}</span></span></div>
          <div class="detail-row"><span class="detail-label">Messaging</span><span class="detail-value"><span class="badge badge-yellow">${ad.ai_messaging_angle || 'N/A'}</span></span></div>
          <div class="detail-row"><span class="detail-label">Hook Tactic</span><span class="detail-value"><span class="badge badge-yellow">${ad.ai_hook_tactic || 'N/A'}</span></span></div>
          <div class="detail-row"><span class="detail-label">Offer Type</span><span class="detail-value"><span class="badge badge-yellow">${ad.ai_offer_type || 'N/A'}</span></span></div>
          ` : ''}
          ${ad.ad_copy ? `<div style="margin-top:12px; font-size:13px; color:#888;">${ad.ad_copy}</div>` : ''}
          <div style="margin-top:12px;">
            ${ad.ad_library_link ? `<a href="${ad.ad_library_link}" target="_blank" class="btn btn-primary btn-small">View in Ad Library</a>` : ''}
          </div>
        `;
        showModal(html);
      } catch (err) { console.error(err); }
    }

    async function scrapeSelected() {
      const selected = Array.from(metaBrand.selectedOptions).map(o => o.value).filter(v => v);
      if (selected.length === 0) {
        alert('Select a brand to scrape');
        return;
      }
      metaStatus.innerHTML = '<span class="spinner"></span>Scraping ' + selected.length + ' brand(s)...';
      metaStatus.classList.add('visible');

      for (const brandId of selected) {
        try {
          const res = await fetch('/api/scrape/brand/' + brandId, { method: 'POST' });
          const data = await res.json();
          if (data.jobId) {
            await pollMetaJob(data.jobId);
          }
        } catch (err) { console.error(err); }
      }
      metaStatus.innerHTML = 'Scrape complete!';
      setTimeout(() => metaStatus.classList.remove('visible'), 3000);
      loadMetaAds();
    }

    function pollMetaJob(jobId) {
      return new Promise((resolve) => {
        const poll = async () => {
          try {
            const res = await fetch('/api/scrape/status/' + jobId);
            const data = await res.json();
            if (data.status === 'complete' || data.status === 'error') {
              resolve(data);
            } else {
              setTimeout(poll, 3000);
            }
          } catch (err) { resolve({ error: err.message }); }
        };
        poll();
      });
    }

    // Event listeners
    document.getElementById('meta-scrape-btn').addEventListener('click', scrapeSelected);
    metaSort.addEventListener('change', loadMetaAds);
    metaMedia.addEventListener('change', loadMetaAds);
    metaBrand.addEventListener('change', loadMetaAds);
    document.getElementById('meta-bookmarked-only').addEventListener('change', loadMetaAds);

    // ========== INIT ==========
    loadTikTokProducts();
    loadBrands();
  </script>
</body>
</html>
