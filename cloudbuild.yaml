steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/gen-lang-client-0234791928/bom-ecom/app:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/gen-lang-client-0234791928/bom-ecom/app:latest'
      - './bom-ecom'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'us-central1-docker.pkg.dev/gen-lang-client-0234791928/bom-ecom/app']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'bom-ecom'
      - '--image=us-central1-docker.pkg.dev/gen-lang-client-0234791928/bom-ecom/app:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'

images:
  - 'us-central1-docker.pkg.dev/gen-lang-client-0234791928/bom-ecom/app'

options:
  logging: CLOUD_LOGGING_ONLY
